# Upstream Configuration Variants for Paper B Analysis
# Each configuration tests different SPOF mitigation parameters

# ============================================================
# CONFIGURATION A: Default (Insecure - No Mitigation)
# max_fails=1, fail_timeout=10s (Nginx defaults)
# ============================================================
# upstream wordpress_backend {
#     server wordpress:80;
# }

# ============================================================
# CONFIGURATION B: Basic Hardening
# max_fails=3, fail_timeout=30s
# ============================================================
upstream wordpress_backend {
    server wordpress:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ============================================================
# CONFIGURATION C: Advanced Hardening
