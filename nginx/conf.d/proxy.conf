# Proxy Timeout Configuration for Paper B Analysis
# These parameters control upstream connection behavior

# ============================================================
# TIMEOUT ANALYSIS SCENARIOS
# ============================================================

# Paper B tests different timeout configurations to evaluate
# their impact on SPOF mitigation effectiveness

# Default Configuration (Nginx defaults)
# proxy_connect_timeout 60s;
# proxy_send_timeout 60s;
# proxy_read_timeout 60s;

# Conservative Configuration (Recommended for Production)
proxy_connect_timeout 10s;
proxy_send_timeout 30s;
proxy_read_timeout 90s;

# Aggressive Configuration (Low Latency)
# proxy_connect_timeout 5s;
# proxy_send_timeout 15s;
# proxy_read_timeout 60s;

# Relaxed Configuration (High Latency Tolerance)
# proxy_connect_timeout 30s;
# proxy_send_timeout60s;
# proxy_read_timeout 180s;

# ============================================================
# CONNECTION REUSE
# ============================================================

# Keepalive connections to upstream
# Paper B: Tests impact of connection pooling on SPOF recovery
keepalive_timeout65s;
keepalive_requests 1000;