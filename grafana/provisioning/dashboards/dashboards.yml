# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'Container Resilience'
    orgId: 1
    folder: 'CRA'
    folderUid: 'cra-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards